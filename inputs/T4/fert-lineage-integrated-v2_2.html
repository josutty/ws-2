<!DOCTYPE html>
<html lang="en" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FERT Lineage Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#172240;--steel:#4A6FA5;--slate:#64748B;--bg:#F1F5F9;--card:#FFF;--border:#E2E8F0;--accent:#2563EB;--asoft:#EFF6FF;--green:#16A34A;--gbg:#F0FDF4;--amber:#D97706;--abg:#FFFBEB;--red:#DC2626;--rbg:#FEF2F2;--purple:#7C3AED;--pbg:#F5F3FF;--teal:#0D9488;--tbg:#F0FDFA;--runner:#0D9488;--repeater:#6366F1;--stranger:#94A3B8;--mono:'JetBrains Mono',monospace;--sans:'Inter',-apple-system,sans-serif}
body{font-family:var(--sans);background:var(--bg);min-height:100vh;display:flex;font-size:13px;color:var(--navy)}
/* ═══ SIDEBAR (global) ═══ */
.sb{width:216px;background:var(--navy);color:#fff;display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:20}
.sb-brand{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand small{font-size:11px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.45);display:block;margin-bottom:3px}
.sb-brand b{font-size:15px;font-weight:600}
.sb-nav{padding:10px 0;flex:1;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;color:rgba(255,255,255,.55);font-size:13px;transition:all .12s}
.ni:hover{background:rgba(255,255,255,.05);color:#fff}
.ni.on{background:rgba(255,255,255,.1);border-left-color:var(--accent);color:#fff;font-weight:600}
.ni .ic{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sb-sub{padding:5px 16px 5px 40px;font-size:11px;color:rgba(255,255,255,.4);cursor:pointer;transition:all .12s}
.sb-sub:hover{color:#fff}
.sb-sub.on{color:var(--accent);font-weight:700}
.sb-sub.on::before{content:"▸ ";color:var(--accent)}
.sb-foot{padding:11px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:rgba(255,255,255,.32)}
/* ═══ MAIN ═══ */
.mn{margin-left:216px;flex:1;padding:22px 26px;max-width:1220px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.hdr h1{font-size:21px;font-weight:700}.hdr .sub{font-size:12px;color:var(--slate);margin-top:3px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;font-size:12px;color:var(--accent);background:var(--asoft);border:1px solid rgba(37,99,235,.15);border-radius:5px;cursor:pointer;font-family:var(--sans);margin-bottom:14px;font-weight:500}
.back-btn:hover{background:rgba(37,99,235,.12)}
/* ═══ SHARED PRIMITIVES ═══ */
.badge,.bg{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.card,.cd{background:var(--card);border:1px solid var(--border);border-radius:8px}
.btn{padding:8px 18px;font-size:12px;font-weight:600;border:none;border-radius:5px;cursor:pointer;font-family:var(--sans);transition:all .12s}
.bp{color:#fff;background:var(--accent)}.bp:hover{background:#1d4ed8}.bp:disabled{opacity:.45;cursor:not-allowed}
.bo{color:var(--slate);background:transparent;border:1px solid var(--border)}.bo:hover{border-color:var(--accent);color:var(--accent)}
.bs{padding:4px 11px;font-size:11px}
.bpurple{color:var(--purple);background:var(--pbg);border:1px solid rgba(124,58,237,.2)}
.bamber{color:var(--amber);background:var(--abg);border:1px solid rgba(217,119,6,.2)}
/* ═══ DASHBOARD ═══ */
.kpi-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:15px 19px;flex:1;min-width:150px}
.kpi-card .kl{font-size:11px;color:var(--slate);font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.kpi-card .kv{font-size:27px;font-weight:700;letter-spacing:-.02em}
.kpi-card .ks{font-size:11px;color:var(--slate);margin-top:3px}
.readiness{display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:6px;font-size:13px;font-weight:600}
.rr-row{display:flex;gap:18px}.rr-item{flex:1;text-align:center}
.rr-circle{width:62px;height:62px;border-radius:50%;border:4px solid;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.rr-circle .n{font-size:19px;font-weight:700}
.rr-lbl{font-size:12px;font-weight:600}.rr-pct{font-size:11px;color:var(--slate)}
.rr-bar{margin-top:15px;height:8px;border-radius:4px;overflow:hidden;display:flex}
.lc-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.lc-row .nm{width:82px;font-size:12px;color:var(--slate)}
.lc-track{flex:1;height:19px;background:#F1F5F9;border-radius:4px;overflow:hidden;position:relative}
.lc-fill{height:100%;border-radius:4px}
.lc-val{position:absolute;left:8px;top:2px;font-size:11px;font-weight:600}
.task-table{width:100%;border-collapse:collapse;font-size:13px}
.task-table thead th{padding:9px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--slate);border-bottom:1px solid var(--border);background:#F8FAFC}
.task-table tbody td{padding:10px 16px;border-bottom:1px solid var(--border)}
/* ═══ DISCOVERY TAB BAR (shared by New Fert Mapping / Universe / Pairs / Clusters / Radar) ═══ */
.tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:18px}
.tb{padding:9px 17px;font-size:13px;font-weight:400;color:var(--slate);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-2px;font-family:var(--sans);display:flex;align-items:center;gap:5px;transition:all .12s}
.tb.on{font-weight:700;color:var(--accent);border-bottom-color:var(--accent)}
.tc{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700}
/* ═══ NEW FERT MAPPING (nm-) ═══ */
.nm-grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
.nm-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;align-self:start}
.nm-char{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.nm-char .k{color:var(--slate)}.nm-char .v{font-weight:600}
.nm-sugg{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px;transition:all .15s}
.nm-sugg.picked{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.nm-sugg.dimmed{opacity:.35;position:relative}
.nm-sugg.dimmed::after{content:"OVERRIDDEN";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-6deg);font-size:15px;font-weight:800;color:var(--red);letter-spacing:.1em;pointer-events:none}
.nm-sugg-main{display:flex;align-items:center;gap:13px;padding:13px 17px;cursor:pointer}
.nm-cb{width:20px;height:20px;border-radius:4px;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.nm-cb.on{border-color:var(--accent);background:var(--accent)}
.nm-match{text-align:center;min-width:64px}
.nm-match .n{font-size:23px;font-weight:700}.nm-match .l{font-size:9px;color:var(--slate)}
.nm-expand{padding:0 17px 15px 53px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbar{display:flex;align-items:center;gap:7px;font-size:11px}.sbar .sl{color:var(--slate);width:82px;flex-shrink:0}
.sbar .st{flex:1;height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden}.sbar .sf{height:100%;border-radius:3px}
.sbar .sv{font-weight:600;width:32px;text-align:right}
.nm-actions{display:flex;gap:8px;margin-top:6px}
.nm-override{background:var(--pbg);border:2px solid rgba(124,58,237,.15);border-radius:8px;padding:18px;margin-top:12px}
.nm-nopred{background:var(--abg);border:2px solid rgba(217,119,6,.18);border-radius:8px;padding:18px;margin-top:12px}
.nm-search-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--sans);outline:none;margin-bottom:10px}
.nm-search-input:focus{border-color:var(--purple)}
.nm-search-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px}
.nm-search-row:hover{background:var(--pbg)}
.rchip{padding:4px 11px;font-size:11px;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:var(--sans);transition:all .12s}
.rchip.on{border-color:var(--purple);background:var(--pbg);color:var(--purple);font-weight:600}
.jtxt{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--sans);outline:none;resize:vertical;min-height:56px}
.gtier{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:6px;font-size:12px;margin-top:12px}
.gtier.gs{background:var(--gbg);border:1px solid rgba(22,163,74,.12);color:var(--green)}
.gtier.ge{background:var(--abg);border:1px solid rgba(217,119,6,.12);color:var(--amber)}
.gtier.gh{background:var(--rbg);border:1px solid rgba(220,38,38,.12);color:var(--red)}
.nm-relbuilder{background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:18px}
.topt{flex:1;padding:12px 13px;border:2px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);transition:all .12s;text-align:center}
.topt:hover{border-color:var(--accent)}.topt.on{border-color:var(--accent);background:var(--asoft)}
.topt .tl{font-size:13px;font-weight:600}.topt.on .tl{color:var(--accent)}.topt .td{font-size:10px;color:var(--slate);margin-top:2px}
.nm-insights{background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:16px}
.itag{padding:3px 9px;font-size:10px;border-radius:11px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:var(--sans);transition:all .12s;color:var(--slate)}
.itag.on{border-color:var(--accent);background:var(--asoft);color:var(--accent);font-weight:600}
.icard{padding:9px 11px;background:var(--card);border-radius:6px;margin-top:7px;border-left:3px solid var(--accent);font-size:11px}
.nm-cta{background:linear-gradient(135deg,var(--asoft),var(--tbg));border:2px solid rgba(37,99,235,.15);border-radius:8px;padding:18px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
/* ═══ UNIVERSE / PAIRS / CLUSTERS / RADAR (disc-) ═══ */
.fltr{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
.fsel{padding:5px 9px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:var(--card);font-family:var(--sans);outline:none}
.sinp{padding:6px 11px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:var(--sans);outline:none;min-width:190px}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt thead th{padding:8px 11px;text-align:left;font-size:10px;font-weight:600;color:var(--slate);border-bottom:1px solid var(--border);background:#F8FAFC;position:sticky;top:0}
.dt tbody td{padding:8px 11px;border-bottom:1px solid var(--border)}
.dt tbody tr{cursor:pointer;transition:background .08s}.dt tbody tr:hover{background:#F8FAFC}
.dt tbody tr.sel{background:var(--asoft);border-left:3px solid var(--accent)}
.dt code{font-family:var(--mono);font-size:11px;font-weight:600}
.lb{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.lb-m{color:var(--green);background:var(--gbg)}.lb-p{color:var(--amber);background:var(--abg)}.lb-u{color:var(--red);background:var(--rbg)}
.bbar{display:flex;align-items:center;gap:9px;padding:9px 15px;background:var(--asoft);border:1px solid rgba(37,99,235,.12);border-radius:7px;margin-bottom:11px}
.pc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:11px}
.pf{display:grid;grid-template-columns:1fr 44px 1fr;gap:9px;align-items:center}
.pfb{background:#F8FAFC;border-radius:6px;padding:11px;border:1px solid var(--border)}
.pa{text-align:center;font-size:19px;color:var(--accent)}
.psig{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.psi{text-align:center;padding:6px;background:#F8FAFC;border-radius:4px}
.psi .v{font-size:15px;font-weight:700}.psi .l{font-size:9px;color:var(--slate);margin-top:1px}
.clcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:11px}
.clchain{display:flex;align-items:center;overflow-x:auto;padding:7px 0}
.cln{padding:8px 11px;border:2px solid var(--border);border-radius:6px;background:#F8FAFC;min-width:115px;flex-shrink:0;font-size:10px;cursor:pointer}
.cln.ca{border-color:var(--green)}.cln.cb{border-color:var(--red);opacity:.6}
.cll{padding:0 6px;font-size:15px;color:var(--accent);flex-shrink:0}
.rside{border-radius:6px;padding:11px}.rside.rd{background:var(--rbg)}.rside.rg{background:var(--gbg)}
/* ═══ DEMAND HISTORY WORKBENCH (dh-) ═══ */
.dh-kpi-row{display:flex;gap:12px;margin-bottom:18px}
.dh-kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 18px;flex:1;min-width:0}
.dh-kpi .l{font-size:11px;color:var(--slate);font-weight:500;margin-bottom:4px}
.dh-kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.dh-kpi .s{font-size:11px;color:var(--slate);margin-top:2px}
.chain-strip{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:14px 0}
.chain-node-wrap{display:flex;align-items:center;flex-shrink:0}
.chain-node{width:212px;border:2px solid var(--border);border-radius:10px;padding:13px;background:var(--card);position:relative;cursor:pointer;transition:all .2s}
.chain-node:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.chain-node.active-node{border-color:var(--green)}
.chain-node.blocked-node{border-color:var(--red);opacity:.65}
.chain-node.new-node{border-color:var(--accent)}
.chain-node.sel-node{box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.chain-node .ns{position:absolute;top:-8px;right:11px;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600}
.chain-link{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;flex-shrink:0}
.chain-link-arrow{font-size:19px;color:var(--accent)}
.chain-link-lbl{font-size:9px;color:var(--slate);text-align:center;margin-top:2px;font-weight:600}
.chain-link-pct{font-size:11px;color:var(--accent);font-weight:700}
.dh-tabs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px;width:fit-content}
.dh-tab{padding:7px 15px;font-size:12px;border:none;cursor:pointer;font-family:var(--sans);background:var(--card);color:var(--slate);font-weight:500}
.dh-tab.on{background:var(--accent);color:#fff;font-weight:600}
.chart-area-wrap{position:relative;overflow-x:auto}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;gap:1px}
.chart-bar{border-radius:2px 2px 0 0;min-height:1px;transition:height .3s;position:relative}
.chart-legend{display:flex;gap:16px;margin-top:11px;padding-top:9px;border-top:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--slate)}
.legend-dot{width:10px;height:10px;border-radius:2px}
.cf-option{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--border);border-radius:6px;cursor:pointer;margin-bottom:7px;transition:all .12s;background:var(--card)}
.cf-option:hover{border-color:var(--accent)}
.cf-option.on{border-color:var(--accent);background:var(--asoft)}
.cf-option .rd{width:15px;height:15px;border-radius:50%;border:2px solid #CBD5E1;flex-shrink:0}
.cf-option.on .rd{border-color:var(--accent);background:var(--accent);position:relative}
.cf-option.on .rd::after{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#fff}
.detail-table{width:100%;border-collapse:collapse;font-size:12px}
.detail-table thead th{padding:7px 9px;text-align:right;font-size:10px;font-weight:600;color:var(--slate);border-bottom:2px solid var(--border);background:#F8FAFC}
.detail-table thead th:first-child{text-align:left}
.detail-table tbody td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.detail-table tbody td:first-child{text-align:left;font-weight:500}
.detail-table tfoot td{padding:7px 9px;text-align:right;border-top:2px solid var(--navy);font-weight:700}
.detail-table tfoot td:first-child{text-align:left}
.inherited-val{color:var(--purple);font-style:italic}.own-val{color:var(--teal);font-weight:600}
.stitched-val{color:var(--accent);font-weight:700}.zero-val{color:#CBD5E1}
.scale-input{width:56px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;text-align:center;font-family:var(--sans)}
/* ═══ FAMILY EXPLORER (fam-) ═══ */
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:15px;margin-bottom:20px}
.fam-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:19px;cursor:pointer;transition:all .12s;position:relative;overflow:hidden}
.fam-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.fam-bg{position:absolute;bottom:0;left:0;right:0;background:rgba(37,99,235,.04);transition:height .3s}
.fam-inner{position:relative}
.fam-hdr2{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.fam-name{font-size:14px;font-weight:700}.fam-meta{font-size:11px;color:var(--slate);margin-top:2px}
.fam-stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.fam-stat .n{font-size:21px;font-weight:700}.fam-stat .l{font-size:11px;color:var(--slate)}
.fam-codes{display:flex;gap:4px;flex-wrap:wrap}
.fam-codes code{font-family:var(--mono);font-size:10px;padding:2px 6px;background:#F1F5F9;border-radius:3px;color:var(--slate)}
</style>

<script>

function spk(d,w=80,h=24,c="var(--accent)"){if(!d||!d.length)return"";const mx=Math.max(...d,1);const p=d.map((v,i)=>`${(i/(d.length-1))*w},${h-(v/mx)*(h-4)}`).join(" ");return`<svg width="${w}" height="${h}" style="display:block"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`}

function compSim(a,b){let m=0;CHARS.forEach(k=>{if(a[k]===b[k])m++});const cm=Math.round(m/CHARS.length*100);
  // deterministic pseudo-signals so repeated renders are stable (seeded by id concat)
  const seed=(a.id+b.id).split("").reduce((s,c)=>s+c.charCodeAt(0),0);
  const dm=Math.round(50+(seed%35));const dc=Math.round(40+((seed*7)%45));const tp=Math.round(50+((seed*13)%40));
  return{cm,dm,dc,tp,comp:Math.round(cm*.4+dm*.2+dc*.25+tp*.15)};
}
function govTier(sim,isOverride){if(!isOverride)return"gs";if(!sim)return"gs";return sim.comp<50?"gh":sim.comp<70?"ge":"gs"}

  </div>`;
}

function renderMapping(){
  if(S.mapMode==="suggest") return renderMappingSuggest();
  return renderMappingPair();
}

  const anchor=S.anchorId?byId(S.anchorId):null;
  if(!anchor){
    // land here with nothing chosen — offer to pick an anchor
    return`<div class="hdr"><div><h1>Fert Lineage Discovery</h1><div class="sub">AI-powered predecessor matching, bulk discovery, and demand migration detection</div></div></div>
    ${tabBarHTML('mapping')}

      <div style="font-size:15px;font-weight:700;margin-bottom:8px">Select a FERT to find its lineage</div>

    </div>`;
  }
  const excludeIds=[anchor.id];
  const cands=FERTS.filter(f=>!excludeIds.includes(f.id)).map(f=>({...f,...compSim(f,anchor)})).sort((a,b)=>b.comp-a.comp).slice(0,4);
  const picked=S.pickedId?byId(S.pickedId):null;
  const pickedSim=picked?compSim(picked,anchor):null;
  const isOverriding=S.overrideMode;

  return`
  <div class="hdr"><div><h1>Fert Lineage Discovery</h1><div class="sub">AI-powered predecessor matching, bulk discovery, and demand migration detection</div></div></div>
  ${tabBarHTML('mapping')}
  <div class="nm-grid">
    <div class="nm-panel">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        ${anchor.st==="New"?bd_("NEW FERT","#fff","var(--accent)"):bd_("ANCHOR FERT","#fff","var(--steel)")}
        <span style="font-size:11px;color:var(--slate)">Created ${anchor.cr}</span>
      </div>
      <code style="font-family:var(--mono);font-size:16px;font-weight:700;display:block;margin-bottom:4px">${anchor.id}</code>
      <div style="font-size:13px;color:var(--slate);margin-bottom:16px;line-height:1.5">${anchor.d}</div>
      <div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--slate);margin-bottom:8px">CHARACTERISTICS</div>
      ${CHARS.map(k=>`<div class="nm-char"><span class="k">${CLBL[k]}</span><span class="v">${anchor[k]}</span></div>`).join("")}
      ${anchor.route?`<div class="nm-char"><span class="k">Route</span><span class="v">${anchor.route}</span></div>`:""}
      ${anchor.pclass?`<div class="nm-char"><span class="k">Project Class</span><span class="v">${anchor.pclass}</span></div>`:""}
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
        <button class="btn bo" style="width:100%;font-size:12px" onclick="S.showInsights=!S.showInsights;render()">${S.showInsights?"▾ Hide":"▸"} Matching Insights (${INSIGHTS.length})</button>
      </div>
    </div>

    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:13px;font-weight:600">AI-Suggested Predecessors <span style="font-weight:400;color:var(--slate)">— ranked by composite match</span></div>
        ${!isOverriding?`<button class="btn bs bpurple" onclick="S.overrideMode=true;render()">&#9889; Override — Select Different FERT</button>`:`<button class="btn bs bo" onclick="S.overrideMode=false;render()">&#10005; Cancel Override</button>`}
      </div>

      ${cands.map(c=>{

        return`<div class="nm-sugg ${isSel?"picked":""} ${isOverriding?"dimmed":""}">
          <div class="nm-sugg-main" onclick="${isOverriding?"":`S.pickedId='${c.id}';render()`}">
            <div class="nm-cb ${isSel?"on":""}">${isSel?'<span style="color:#fff;font-size:12px;font-weight:700">✓</span>':""}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px">
                <code style="font-family:var(--mono);font-size:12px;font-weight:600">${c.id}</code>${sb(c.st)}${rb(c.rrs)}${lb(c.lc)}
              </div>
              <div style="font-size:12px;color:var(--slate);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.d}</div>
            </div>
            ${spk(c.s,80,24,spkC(c.lc))}
            <div class="nm-match"><div class="n" style="color:${scC(c.comp)}">${c.comp}%</div><div class="l">MATCH</div></div>
            <button onclick="event.stopPropagation();S.expandedCard=S.expandedCard==='${c.id}'?null:'${c.id}';render()" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--slate)">${isExp?"▾":"▸"}</button>
          </div>
          ${isExp&&!isOverriding?`<div class="nm-expand">${sBarH(c.cm,"Characteristics")}${sBarH(c.dm,"Description")}${sBarH(c.dc,"Demand Corr.")}${sBarH(c.tp,"Temporal")}</div>`:""}

function renderMappingPair(){
  const a=S.slotA?byId(S.slotA):null,b=S.slotB?byId(S.slotB):null;
  const both=a&&b;
  const srcLabel={dashboard:"Dashboard Task",universe:"FERT Universe",pairs:"System-Detected Pair",clusters:"Cluster Review",radar:"Migration Radar",sidebar:"Manual"}[S.mapSource]||"Manual";
  return`
  <div class="hdr"><div><h1>Fert Lineage Discovery</h1><div class="sub">Source: ${srcLabel} &middot; Both FERTs pre-selected — review similarity and define relationship</div></div></div>

    ${[["A — Predecessor",a,"slotA"],["B — Successor",b,"slotB"]].map(([lbl,f,key],i)=>{
      if(i===1){} 
      return f?`<div class="card" style="padding:16px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <span style="font-size:9px;font-weight:600;color:var(--slate)">${lbl}</span>
          <button class="btn bs bo" style="margin-left:auto" onclick="S.${key}=null;render()">✕</button></div>

        <div style="display:flex;align-items:center;gap:8px">${sb(f.st)}${rb(f.rrs)}${lb(f.lc)}<span style="font-size:12px;font-weight:700;margin-left:auto">${fmt(f.vol)}</span></div>
        ${spk(f.s,150,22,spkC(f.lc))}
      </div>`:`<div class="card" style="padding:16px;border-style:dashed;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:110px;cursor:pointer" onclick="promptSlot('${key}')">
        <span style="font-size:20px;color:#CBD5E1">+</span><span style="font-size:11px;color:var(--slate)">${lbl}</span></div>`;
    }).join('<div style="display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent)">&rarr;</div>')}

  ${both?`<div style="margin-top:12px"><button class="btn bo" onclick="S.showInsights=!S.showInsights;render()">${S.showInsights?"▾ Hide":"▸ Show"} Matching Insights (${INSIGHTS.length})</button></div>`:""}
  `;
}

function promptSlot(key){const id=prompt("Enter FERT code:");if(id){const f=byId(id);if(f){S[key]=id;render()}else alert("FERT not found")}}

function renderOverridePanel(anchor,excludeIds){
  const q=S.manualSearch.toLowerCase();
  let results=FERTS.filter(f=>!excludeIds.includes(f.id));
  if(q)results=results.filter(f=>f.id.toLowerCase().includes(q)||f.d.toLowerCase().includes(q));
  results=results.slice(0,8);
  return`<div class="nm-override">
    <div style="font-size:13px;font-weight:700;color:var(--purple);margin-bottom:10px">&#9889; Manual Override — Search Full Universe</div>
    <input class="nm-search-input" placeholder="Search FERT code or description..." value="${S.manualSearch}" oninput="S.manualSearch=this.value;render()" autofocus>
    <div style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--card)">
      ${results.map(f=>`<div class="nm-search-row" onclick="S.pickedId='${f.id}';S.overrideMode=false;render()">
        <code style="font-family:var(--mono);font-weight:600">${f.id}</code>
        <span style="flex:1;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.d}</span>
        ${sb(f.st)}${rb(f.rrs)}${spk(f.s,55,16,spkC(f.lc))}</div>`).join("")}
    </div>
  </div>`;
}

  const highConf=cands.filter(c=>c.comp>=70).length;
  return`<div class="nm-nopred">
    <div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:10px">&#8856; No Predecessor Declaration</div>
    ${highConf>0?`<div class="gtier ge"><b>&#9888; Elevated Approval Required</b><span style="margin-left:6px;opacity:.85">${highConf} suggestion(s) scored above 70% — rejecting them needs justification</span></div>`:""}
    <div style="font-size:11px;font-weight:600;margin:10px 0 6px">Reason Code *</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
      ${["New platform launch","New market segment","First VECV entry","No related product exists","Other"].map(r=>`<button class="rchip ${S.noPredReason===r?"on":""}" onclick="S.noPredReason='${r}';render()">${r}</button>`).join("")}
    </div>
    <div style="font-size:11px;font-weight:600;margin-bottom:6px">Justification *</div>
    <textarea class="jtxt" placeholder="Explain why this FERT has no predecessor..." oninput="S.justification=this.value">${S.justification}</textarea>
    <button class="btn bp" style="margin-top:10px" ${!S.noPredReason?"disabled":""} onclick="alert('No-predecessor declaration submitted for approval')">Submit Declaration →</button>

}

function renderRelationshipSection(a,b,sim,isPairMode){
  const isOverrideOrigin=!isPairMode && S.overrideMode===false && S.pickedId && !FERTS.filter(f=>f.id!==a.id).slice(0,4).map(x=>x.id).includes(S.pickedId);
  const tier=govTier(sim,false); // simplified: tier based on similarity regardless of path, keeps logic legible
  const realTier=sim.comp<50?"gh":sim.comp<70?"ge":"gs";
  return`
  <div class="card" style="padding:20px;margin-top:${isPairMode?'0':'16px'}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:13px;font-weight:600">Computed Similarity — ${a.id} ↔ ${b.id}</span>
      <span style="font-size:26px;font-weight:800;color:${scC(sim.comp)}">${sim.comp}%</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      ${[["Characteristics",sim.cm],["Description",sim.dm],["Demand Corr.",sim.dc],["Temporal",sim.tp]].map(([l,v])=>
        `<div style="text-align:center;padding:10px;background:#F8FAFC;border-radius:6px"><div style="font-size:19px;font-weight:700;color:${scC(v)}">${v}%</div><div style="font-size:9px;color:var(--slate);margin-top:2px">${l}</div></div>`).join("")}

    <div style="font-size:10px;font-weight:600;color:var(--slate);margin-bottom:6px">CHARACTERISTIC COMPARISON</div>
    <div style="display:grid;grid-template-columns:1fr 28px 1fr;font-size:11px;margin-bottom:14px">
      <div style="padding:5px 8px;font-weight:600;font-size:10px;color:var(--slate);background:#F8FAFC;border-bottom:1px solid var(--border)">${a.id}</div>
      <div style="padding:5px 8px;font-weight:600;font-size:10px;color:var(--slate);background:#F8FAFC;border-bottom:1px solid var(--border);text-align:center">&equiv;</div>
      <div style="padding:5px 8px;font-weight:600;font-size:10px;color:var(--slate);background:#F8FAFC;border-bottom:1px solid var(--border)">${b.id}</div>
      ${CHARS.map(k=>{const va=a[k],vb=b[k],m=va===vb;return`<div style="padding:4px 8px;border-bottom:1px solid var(--border);${m?"":"font-weight:600"}">${va}</div><div style="padding:4px;border-bottom:1px solid var(--border);text-align:center;color:${m?"var(--green)":"var(--red)"}">${m?"✓":"✗"}</div><div style="padding:4px 8px;border-bottom:1px solid var(--border);${m?"":"font-weight:600;color:var(--red)"}">${vb}</div>`}).join("")}
    </div>

    <div style="font-size:12px;font-weight:600;margin-bottom:8px">Transition Type</div>
    <div style="display:flex;gap:8px;margin-bottom:6px">
      ${[["migration","Migration","Full replacement"],["ramp","Ramp Up/Down","Gradual transition"],["parallel","Parallel","Both continue"]].map(([k,l,d])=>
        `<div class="topt ${S.transType===k?"on":""}" onclick="S.transType='${k}';render()"><div class="tl">${l}</div><div class="td">${d}</div></div>`).join("")}
    </div>
    ${S.transType==="ramp"?`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 0">${["Aug'26","Sep'26","Oct'26","Nov'26","Dec'26","Jan'27"].map(m=>`<div><div style="font-size:9px;color:var(--slate);text-align:center;margin-bottom:3px">${m}</div><input type="number" min="0" max="100" placeholder="%" style="width:100%;padding:5px 3px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:12px;font-weight:600;font-family:var(--sans)"></div>`).join("")}</div>`:""}

    ${sim.comp<70?`<div class="gtier ${realTier}" style="margin-top:12px"><b>${realTier==="gh"?"&#9940; High Scrutiny":"&#9888; Elevated"} Approval</b><span style="margin-left:6px;opacity:.85">Low similarity match — reason code required</span></div>
      <div style="margin-top:10px"><div style="font-size:11px;font-weight:600;margin-bottom:6px">Override Reason Code *</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">${RCODES.map(r=>`<button class="rchip ${S.reasonCode===r?"on":""}" onclick="S.reasonCode='${r}';render()">${r}</button>`).join("")}</div>
      <textarea class="jtxt" placeholder="Justification..." oninput="S.justification=this.value">${S.justification}</textarea></div>`:`<div class="gtier gs" style="margin-top:12px"><b>&#10003; Standard Approval</b><span style="margin-left:6px;opacity:.85">Marketing &rarr; PPC &rarr; MDM</span></div>`}

    ${S.transType?`<div class="nm-cta">
      <div><div style="font-size:13px;font-weight:700;color:var(--navy)">Next: Configure Demand Carry-Forward</div>

      <button class="btn bp" onclick="handoffToDemandHistory('${a.id}','${b.id}')">Configure Carry-Forward →</button>
    </div>`:""}

}

function handoffToDemandHistory(idA,idB){
  // find if this pair belongs to a known rich chain
  const chainKey=Object.keys(CHAINS).find(k=>CHAINS[k].members.includes(idA)&&CHAINS[k].members.includes(idB));
  const returnTo=S.screen;
  if(chainKey){ goDemandHistory({chainKey,focus:idB,returnTo}); }
  else{ goDemandHistory({pair:[idA,idB],focus:idB,returnTo}); }
}

  return`<div class="nm-insights">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:13px;font-weight:600">&#128161; Matching Insights &amp; Feedback</div>
      <div style="font-size:11px;color:var(--slate);font-style:italic">Your feedback improves the scoring engine</div></div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">${ITAGS.map(t=>`<button class="itag ${S.insightTags.includes(t)?"on":""}" onclick="togIT('${t}')">${t}</button>`).join("")}</div>
    <div style="display:flex;gap:6px">
      <input class="sinp" style="flex:1" placeholder="What should the engine do differently?" value="${S.insightText}" oninput="S.insightText=this.value">
      <button class="btn bs bp" onclick="submitInsight('${context}')">Submit</button></div>
    <div style="margin-top:10px">${INSIGHTS.map(ins=>`<div class="icard"><div style="display:flex;gap:8px;font-size:10px;color:var(--slate);margin-bottom:3px"><b style="color:var(--navy)">${ins.u}</b><span>${ins.dt}</span><code style="font-size:9px">${ins.fp}</code></div>${ins.tx}<div style="margin-top:5px">${ins.tags.map(t=>`<span style="font-size:10px;padding:2px 6px;border-radius:8px;background:var(--asoft);color:var(--accent);margin-right:3px">${t}</span>`).join("")}</div></div>`).join("")}</div>
    <div style="margin-top:10px;padding:9px 11px;background:var(--card);border-radius:6px;border:1px solid var(--border);font-size:11px">
      <b>Engine Improvement Tracker:</b> <span style="color:var(--slate)">23 insights submitted &middot; </span><span style="color:var(--green);font-weight:600">14 incorporated</span><span style="color:var(--slate)"> &middot; override rate </span><span style="color:var(--amber);font-weight:600">18%</span><span style="color:var(--green)"> ↓ from 31%</span>
    </div>
  </div>`;
}
function togIT(t){const i=S.insightTags.indexOf(t);if(i>-1)S.insightTags.splice(i,1);else S.insightTags.push(t);render()}
function submitInsight(ctx){if(S.insightText.trim()){INSIGHTS.unshift({u:"You",dt:"Now",tx:S.insightText,tags:[...S.insightTags],fp:ctx});S.insightText="";S.insightTags=[];render()}}

function renderUniverse(){
  let fs=FERTS.slice();

function getActiveChain(){
  if(S.dhChainKey && CHAINS[S.dhChainKey]){
    const ch=CHAINS[S.dhChainKey];
    return{name:ch.name,members:ch.members.map(id=>({...byId(id),s36:S36[id]||padTo36(byId(id).s)})),transitions:ch.transitions,pct:ch.pct,rich:true};
  }
  if(S.dhCustomPair){
    const[a,b]=S.dhCustomPair;
    const fa=byId(a),fb=byId(b);
    return{name:`${a} → ${b}`,members:[{...fa,s36:padTo36(fa.s)},{...fb,s36:padTo36(fb.s)}],transitions:["Pending"],pct:[null],rich:false};
  }
  return null;
}
function padTo36(s12){return[...Array(24).fill(0),...s12]}
function sum(arr){return arr.reduce((a,b)=>a+b,0)}

function getStitchedSeries(chain){
  const n=36;
  const stitched=new Array(n).fill(0),sources=new Array(n).fill(-1);
  for(let m=0;m<n;m++){
    for(let f=chain.members.length-1;f>=0;f--){
      if(chain.members[f].s36[m]>0){stitched[m]=chain.members[f].s36[m];sources[m]=f;break;}
    }
  }
  return{stitched,sources};
}
function getFocusIdx(chain){
  const idx=chain.members.findIndex(m=>m.id===S.dhFocus);
  return idx>=0?idx:chain.members.length-1;
}
function getCarryForwardSeries(chain,focusIdx){
  const{stitched,sources}=getStitchedSeries(chain);
  const n=36,result=new Array(n).fill(0);
  for(let m=0;m<n;m++){
    const own=chain.members[focusIdx].s36[m];
    let inherited=0;
    if(sources[m]<focusIdx && sources[m]>=0){
      if(S.cfMethod==="full") inherited=stitched[m];
      else if(S.cfMethod==="scaled") inherited=Math.round(stitched[m]*S.scaleFactor/100);
      else if(S.cfMethod==="selective") inherited=stitched[m]; // simplified: all periods included by default
      // "none" -> stays 0
    }
    result[m]=own+inherited;
  }
  return result;
}

function renderStitchedChart(chain,cfSeries,sources,focus){
  const maxVal=Math.max(...cfSeries,1);const barW=20,gap=3,chartH=150;
  return`<div class="cd" style="padding:16px;overflow-x:auto">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">Stitched Demand Timeline — 36 Months</div>
    <div style="position:relative;height:${chartH+28}px;min-width:${(barW+gap)*36}px">
      ${MONTHS_36.map((m,i)=>{
        const val=cfSeries[i],ownVal=focus.s36[i],inhVal=Math.max(val-ownVal,0);
        const ownH=(ownVal/maxVal)*chartH,inhH=(inhVal/maxVal)*chartH;
        const x=i*(barW+gap);
        return`<div style="position:absolute;left:${x}px;bottom:0;width:${barW}px;display:flex;flex-direction:column;align-items:center">
          <div style="position:relative;width:${barW}px;height:${chartH}px;display:flex;flex-direction:column;justify-content:flex-end">
            ${inhVal>0?`<div class="chart-bar" style="height:${inhH}px;background:var(--purple);opacity:.5;width:100%" title="${m}: ${inhVal} inherited"></div>`:""}
            ${ownVal>0?`<div class="chart-bar" style="height:${ownH}px;background:var(--teal);width:100%" title="${m}: ${ownVal} own"></div>`:""}
            ${val===0?`<div style="height:2px;background:#E2E8F0;width:100%;border-radius:1px"></div>`:""}
          </div>
          ${i%3===0?`<div style="font-size:9px;color:var(--slate);margin-top:4px">${m}</div>`:`<div style="height:14px"></div>`}
        </div>`;
      }).join("")}
    </div>
    <div class="chart-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--teal)"></div>Own demand (${focus.id})</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--purple);opacity:.5"></div>Inherited from predecessors</div>
      <div class="legend-item" style="margin-left:auto;font-weight:600;color:var(--accent)">Total stitched: ${fmt(sum(cfSeries))}</div>
    </div></div>`;
}
function renderBreakdownChart(chain){
  const maxVal=Math.max(...chain.members.map(f=>Math.max(...f.s36)),1);const barW=20,gap=3,chartH=150;
  const colors=["#94A3B8","#7C3AED","#0D9488","#2563EB","#DC2626"];
  return`<div class="cd" style="padding:16px;overflow-x:auto">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">Source Breakdown — Which FERT contributed each month</div>
    <div style="position:relative;height:${chartH+28}px;min-width:${(barW+gap)*36}px">
      ${MONTHS_36.map((m,i)=>{const x=i*(barW+gap);let stack="",totalH=0;
        chain.members.forEach((f,fi)=>{const val=f.s36[i];if(val>0){const h=(val/maxVal)*chartH;stack+=`<div class="chart-bar" style="height:${h}px;background:${colors[fi%colors.length]};width:100%" title="${m}: ${f.id}=${val}"></div>`;totalH+=h}});
        if(totalH===0)stack=`<div style="height:2px;background:#E2E8F0;width:100%;border-radius:1px"></div>`;
        return`<div style="position:absolute;left:${x}px;bottom:0;width:${barW}px;display:flex;flex-direction:column;align-items:center">
          <div style="position:relative;width:${barW}px;height:${chartH}px;display:flex;flex-direction:column;justify-content:flex-end">${stack}</div>
          ${i%3===0?`<div style="font-size:9px;color:var(--slate);margin-top:4px">${m}</div>`:`<div style="height:14px"></div>`}</div>`;
      }).join("")}
    </div>
    <div class="chart-legend">${chain.members.map((f,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${colors[i%colors.length]}"></div>${f.id} ${sb(f.st)}</div>`).join("")}</div>
  </div>`;
}
function renderDetailTable(chain,cfSeries,sources,focus){
  return`<div class="cd" style="padding:0;overflow-x:auto">
    <div style="padding:14px 14px 6px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Monthly Demand Detail — Source Attribution</div>
      <div style="font-size:11px;color:var(--slate)"><span style="color:var(--teal);font-weight:600">■ Own</span> &middot; <span style="color:var(--purple);font-weight:600;font-style:italic">■ Inherited</span> &middot; <span style="color:var(--accent);font-weight:700">■ Stitched total</span></div></div>
    <table class="detail-table"><thead><tr><th style="text-align:left;width:90px">Month</th>${chain.members.map(f=>`<th>${f.id.replace("F-","")}</th>`).join("")}<th style="color:var(--accent)">Stitched</th><th>Source</th></tr></thead>
    <tbody>${MONTHS_36.map((m,mi)=>{const src=sources_for(chain)[mi];const srcLabel=src>=0?chain.members[src].id.replace("F-",""):"—";
      return`<tr><td>${m}</td>${chain.members.map((f,fi)=>{const v=f.s36[mi];if(v===0)return`<td class="zero-val">—</td>`;const isOwn=f.id===focus.id;const isInh=src===fi&&fi!==chain.members.findIndex(x=>x.id===focus.id);return`<td class="${isOwn?"own-val":isInh?"inherited-val":""}">${fmt(v)}</td>`}).join("")}<td class="stitched-val">${cfSeries[mi]>0?fmt(cfSeries[mi]):"—"}</td><td style="font-size:10px;color:var(--slate)">${srcLabel}</td></tr>`;
    }).join("")}</tbody>
    <tfoot><tr><td>TOTAL</td>${chain.members.map(f=>`<td>${fmt(sum(f.s36))}</td>`).join("")}<td style="color:var(--accent)">${fmt(sum(cfSeries))}</td><td></td></tr></tfoot></table></div>`;
}
function sources_for(chain){return getStitchedSeries(chain).sources}
function publishCarryForward(fertId){
  const f=byId(fertId);if(f)f.lin="mapped";
  alert(`Carry-forward configuration saved and published to forecasting engine for ${fertId}.`);
  backFromDemand();
}

// ══════════════════════════════════════════════════════════════
// SCREEN: FAMILY EXPLORER
// ══════════════════════════════════════════════════════════════
function renderFamily(){
  const sel=S.famSelected;
  return`<div class="hdr"><div><h1>Fert Family Explorer</h1><div class="sub">Visualize lineage chains and family clusters across the fert universe</div></div></div>
  ${!sel?renderFamilyGrid():renderFamilyDetail(sel)}`;
}
function renderFamilyGrid(){
  const maxVol=Math.max(...CLUSTERS.map(c=>c.tv),1);
  return`<div class="fam-grid">
    ${CLUSTERS.map(c=>{const ratio=c.tv/maxVol;const covPct=Math.round(c.mp/c.tot*100);
      const lcLabel=covPct===100?"Stable":covPct>0?"Transitioning":"Needs Review";
      return`<div class="fam-card" onclick="S.famSelected='${c.id}';render()">
        <div class="fam-bg" style="height:${ratio*40}%"></div>
        <div class="fam-inner">
          <div class="fam-hdr2"><div><div class="fam-name">${c.nm}</div><div class="fam-meta">${c.id} &middot; ${c.v}</div></div>${lb(lcLabel)}</div>
          <div class="fam-stats"><div class="fam-stat"><div class="n" style="color:var(--navy)">${c.tot}</div><div class="l">Fert codes</div></div><div class="fam-stat"><div class="n" style="color:var(--accent)">${(c.tv/1000).toFixed(1)}K</div><div class="l">12M volume</div></div></div>
          <div class="fam-codes">${c.mem.slice(0,3).map(m=>`<code>${m}</code>`).join("")}${c.mem.length>3?`<span style="font-size:10px;color:var(--slate)">+${c.mem.length-3} more</span>`:""}</div>
        </div></div>`}).join("")}
  </div>`;
}
function renderFamilyDetail(clId){
  const c=CLUSTERS.find(x=>x.id===clId);if(!c)return"";
  const mem=c.mem.map(id=>byId(id)).filter(Boolean).sort((a,b)=>a.cr.localeCompare(b.cr));
  return`<button class="back-btn" onclick="S.famSelected=null;render()">← Back to all families</button>
  <div class="card" style="padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px">
      <div><div style="font-size:18px;font-weight:700">${c.nm}</div><div style="font-size:12px;color:var(--slate);margin-top:2px">${c.id} &middot; ${c.tot} fert codes &middot; ${fmt(c.tv)} units (12M)</div></div>
      ${c.chainKey?`<button class="btn bp" onclick="goDemandHistory({chainKey:'${c.chainKey}',focus:'${mem[mem.length-1].id}',returnTo:'family'})">Configure Carry-Forward →</button>`:`<button class="btn bo" onclick="alert('No governed chain configured for this family yet — map its members first in Lineage Discovery.')">Configure Carry-Forward →</button>`}
    </div>
    <div style="font-size:12px;font-weight:600;color:var(--slate);margin-bottom:12px">Lineage Timeline</div>
    ${mem.map((f,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:10px;height:10px;border-radius:50%;background:${f.st==="Active"?"var(--green)":f.st==="Blocked"?"var(--red)":"var(--accent)"};flex-shrink:0"></div>
      <code style="font-family:var(--mono);font-size:12px;font-weight:700;min-width:90px">${f.id}</code>
      ${sb(f.st)}${rb(f.rrs)}${lb(f.lc)}
      <span style="font-size:11px;color:var(--slate);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.d}</span>
      ${spk(f.s,80,20,spkC(f.lc))}
      <span style="font-size:12px;font-weight:600;min-width:60px;text-align:right">${fmt(f.vol)}</span>
    </div>`).join("")}
  </div>`;
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
render();

</script>
