<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#172240;--navy-light:#1E2D52;--steel:#4A6FA5;--slate:#64748B;
  --bg:#F1F5F9;--card:#FFFFFF;--border:#E2E8F0;
  --accent:#2563EB;--accent-soft:#EFF6FF;
  --green:#16A34A;--green-bg:#F0FDF4;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --red:#DC2626;--red-bg:#FEF2F2;
  --runner:#0D9488;--repeater:#6366F1;--stranger:#94A3B8;
  --winner:#16A34A;--stable:#2563EB;--declining:#EA580C;--new-growth:#8B5CF6;--dormant:#9CA3AF;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--navy);min-height:100vh;display:flex}

/* SIDEBAR */
.sidebar{width:220px;background:var(--navy);color:#fff;display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:10}
.sidebar-brand{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-brand small{font-size:13px;font-weight:700;letter-spacing:0.06em;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px}
.sidebar-brand span{font-size:15px;font-weight:600}
.sidebar-nav{padding:12px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;color:rgba(255,255,255,0.6);font-size:13px;transition:all 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#fff}
.nav-item.active{background:rgba(255,255,255,0.1);border-left-color:var(--accent);color:#fff;font-weight:600}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08)}
.sidebar-footer label{font-size:10px;color:rgba(255,255,255,0.4);font-weight:600;letter-spacing:0.05em;display:block;margin-bottom:6px}
.sidebar-footer select{width:100%;padding:6px 8px;border-radius:4px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:12px;outline:none;font-family:var(--sans)}
.sidebar-footer .meta{font-size:10px;color:rgba(255,255,255,0.35);margin-top:8px}

/* MAIN */
.main{margin-left:220px;flex:1;padding:24px 28px;max-width:1100px}

/* HEADER */
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-header h1{font-size:22px;font-weight:700;color:var(--navy)}
.page-header .subtitle{font-size:13px;color:var(--slate);margin-top:4px}
.readiness-badge{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600}
.readiness-dot{width:10px;height:10px;border-radius:50%}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:0.03em;white-space:nowrap}

/* KPI CARDS */
.kpi-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;flex:1;min-width:160px}
.kpi-card .kpi-label{font-size:12px;color:var(--slate);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi-card .kpi-value{font-size:28px;font-weight:700;letter-spacing:-0.02em}
.kpi-card .kpi-sub{font-size:11px;color:var(--slate);margin-top:4px}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px}
.card-title{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:16px}

/* TABLES */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{padding:8px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--slate);border-bottom:1px solid var(--border);letter-spacing:0.03em;background:#F8FAFC}
.data-table tbody td{padding:10px 16px;border-bottom:1px solid var(--border)}
.data-table code{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy)}

/* TABS */
.tab-bar{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab-btn{padding:10px 20px;font-size:13px;font-weight:400;color:var(--slate);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-2px;transition:all 0.15s;font-family:var(--sans)}
.tab-btn.active{font-weight:700;color:var(--accent);border-bottom-color:var(--accent)}

/* BUTTONS */
.btn{padding:8px 20px;font-size:12px;font-weight:600;border:none;border-radius:5px;cursor:pointer;font-family:var(--sans);transition:all 0.15s}
.btn-primary{color:#fff;background:var(--accent)}
.btn-outline{color:var(--slate);background:transparent;border:1px solid var(--border)}
.btn-sm{padding:4px 12px;font-size:11px}
.btn-accent-soft{color:var(--accent);background:var(--accent-soft);border:1px solid rgba(37,99,235,0.2)}

/* SCORE BAR */
.score-bar{display:flex;align-items:center;gap:8px;font-size:11px}
.score-bar .label{color:var(--slate);width:80px;flex-shrink:0}
.score-bar .track{flex:1;height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden}
.score-bar .fill{height:100%;border-radius:3px}
.score-bar .val{font-weight:600;width:32px;text-align:right}

/* DISCOVERY LAYOUT */
.discovery-grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
.fert-detail-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;align-self:start}
.char-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.char-row .k{color:var(--slate)}
.char-row .v{font-weight:600;color:var(--navy)}

/* SUGGESTION CARD */
.suggestion-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:all 0.15s;margin-bottom:10px}
.suggestion-card.selected{border-color:var(--accent)}
.suggestion-card-main{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.suggestion-card-expand{padding:0 16px 14px 52px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checkbox{width:20px;height:20px;border-radius:4px;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.checkbox.checked{border-color:var(--accent);background:var(--accent)}
.match-score{text-align:center;min-width:60px}
.match-score .num{font-size:22px;font-weight:700}
.match-score .lbl{font-size:9px;color:var(--slate)}

/* RELATIONSHIP BUILDER */
.rel-builder{background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:20px}
.trans-options{display:flex;gap:10px;margin-bottom:16px}
.trans-opt{flex:1;padding:12px 14px;border:2px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);transition:all 0.15s}
.trans-opt.active{border-color:var(--accent);background:var(--accent-soft)}
.trans-opt .t-label{font-size:13px;font-weight:600;color:var(--navy)}
.trans-opt.active .t-label{color:var(--accent)}
.trans-opt .t-desc{font-size:11px;color:var(--slate);margin-top:2px}
.ramp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
.ramp-grid .month-label{font-size:10px;color:var(--slate);text-align:center;margin-bottom:4px}
.ramp-grid input{width:100%;padding:6px 4px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:13px;font-weight:600;outline:none;font-family:var(--sans)}
.history-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.history-row .h-label{font-size:12px;color:var(--slate);margin-right:8px}
.history-btn{padding:4px 12px;font-size:12px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--navy);cursor:pointer;font-family:var(--sans)}

/* BULK TABLE */
.bulk-stats{display:flex;gap:12px;margin-bottom:16px;align-items:center}
.bulk-stat-bar{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 16px;font-size:13px}
.bulk-stat-bar span{color:var(--slate)}
.bulk-stat-bar strong{margin:0 2px}
.bulk-filters{margin-left:auto;display:flex;gap:6px}
.filter-btn{padding:5px 12px;font-size:12px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--slate);cursor:pointer;font-family:var(--sans);text-transform:capitalize}
.filter-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

/* MIGRATION RADAR */
.radar-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.radar-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.radar-eyebrow{font-size:10px;font-weight:600;letter-spacing:0.05em;color:var(--slate);margin-bottom:4px}
.radar-segment{font-size:13px;color:var(--navy);font-weight:500}
.radar-overlap{font-size:12px;color:var(--slate);margin-top:2px}
.radar-conf .num{font-size:24px;font-weight:700}
.radar-conf .lbl{font-size:10px;color:var(--slate)}
.radar-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.radar-side{border-radius:6px;padding:12px}
.radar-side.declining{background:var(--red-bg)}
.radar-side.rising{background:var(--green-bg)}
.radar-side-label{font-size:10px;font-weight:600;margin-bottom:6px}
.radar-arrow{font-size:28px;color:var(--accent);text-align:center}

/* FAMILY EXPLORER */
.family-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.family-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.family-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.family-bg{position:absolute;bottom:0;left:0;right:0;background:rgba(37,99,235,0.04);transition:height 0.3s}
.family-inner{position:relative}
.family-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.family-name{font-size:14px;font-weight:700;color:var(--navy)}
.family-meta{font-size:11px;color:var(--slate);margin-top:2px}
.family-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.family-stat .num{font-size:22px;font-weight:700}
.family-stat .lbl{font-size:11px;color:var(--slate)}
.family-codes{display:flex;gap:4px;flex-wrap:wrap}
.family-codes code{font-family:var(--mono);font-size:10px;padding:2px 6px;background:#F1F5F9;border-radius:3px;color:var(--slate)}
.orphan-card{background:var(--red-bg);border:1px dashed rgba(220,38,38,0.3);border-radius:8px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.orphan-num{font-size:32px;font-weight:700;color:var(--red);margin-bottom:4px}

/* LINEAGE TIMELINE */
.timeline{position:relative;padding-left:20px;margin-bottom:24px}
.timeline-line{position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:16px;padding-left:24px}
.timeline-dot{position:absolute;left:-11px;top:6px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.timeline-content{background:#F8FAFC;border-radius:6px;padding:12px;border:1px solid var(--border)}
.timeline-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timeline-desc{font-size:12px;color:var(--slate);margin-top:4px}
.timeline-metrics{display:flex;align-items:center;gap:16px;margin-top:8px}
.timeline-migrate{margin-top:8px;padding:4px 10px;background:var(--amber-bg);border-radius:4px;font-size:11px;color:var(--amber);font-weight:500;display:inline-block}

/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:100px;padding:0 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-val{font-size:10px;font-weight:600;color:var(--navy)}
.bar-fill{width:100%;border-radius:3px 3px 0 0;border:1px solid rgba(37,99,235,0.3);border-bottom:none;background:rgba(37,99,235,0.15);min-height:4px;transition:height 0.3s}
.bar-label{font-size:9px;color:var(--slate)}

/* CHAIN VIEW */
.chain-selector{margin-bottom:16px}
.chain-selector .lbl{font-size:13px;color:var(--slate);margin-bottom:8px}
.chain-buttons{display:flex;gap:8px;flex-wrap:wrap}
.chain-btn{padding:6px 14px;font-size:12px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--navy);cursor:pointer;font-family:var(--sans)}
.chain-btn.active{font-weight:600;color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.chain-container{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:16px}
.chain-node{width:200px;flex-shrink:0;background:#F8FAFC;border:2px solid var(--border);border-radius:8px;padding:12px}
.chain-node.active-node{border-color:var(--green)}
.chain-node.blocked-node{border-color:rgba(220,38,38,0.4);opacity:0.7}
.chain-node.new-node{border-color:var(--accent)}
.chain-node-header{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.chain-node-desc{font-size:10px;color:var(--slate);margin-bottom:6px;line-height:1.4;height:28px;overflow:hidden}
.chain-node-footer{display:flex;justify-content:space-between;margin-top:6px;align-items:center}
.chain-node-date{font-size:10px;color:var(--slate);margin-top:4px}
.chain-link{display:flex;flex-direction:column;align-items:center;padding:0 8px;min-width:50px;flex-shrink:0}
.chain-link-line{width:36px;height:2px;background:var(--accent)}
.chain-link-label{font-size:9px;color:var(--accent);font-weight:600;margin-top:2px}

/* TOGGLE */
.view-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.toggle-btn{padding:6px 16px;font-size:12px;border:none;cursor:pointer;font-family:var(--sans);background:var(--card);color:var(--slate)}
.toggle-btn.active{background:var(--accent);color:#fff;font-weight:600}

/* RRS DONUT */
.rrs-row{display:flex;gap:20px}
.rrs-item{flex:1;text-align:center}
.rrs-circle{width:64px;height:64px;border-radius:50%;border:4px solid;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.rrs-circle .num{font-size:20px;font-weight:700}
.rrs-label{font-size:12px;font-weight:600}
.rrs-pct{font-size:11px;color:var(--slate)}
.rrs-bar{margin-top:16px;height:8px;border-radius:4px;overflow:hidden;display:flex}

/* LC BARS */
.lc-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lc-row .lc-name{width:80px;font-size:12px;color:var(--slate)}
.lc-track{flex:1;height:20px;background:#F1F5F9;border-radius:4px;overflow:hidden;position:relative}
.lc-fill{height:100%;border-radius:4px}
.lc-val{position:absolute;left:8px;top:2px;font-size:11px;font-weight:600}

/* CONFIRM/REJECT BTNS */
.btn-confirm{padding:3px 8px;font-size:11px;background:var(--green-bg);color:var(--green);border:1px solid rgba(22,163,74,0.2);border-radius:3px;cursor:pointer;font-weight:600;font-family:var(--sans)}
.btn-reject{padding:3px 8px;font-size:11px;background:var(--red-bg);color:var(--red);border:1px solid rgba(220,38,38,0.2);border-radius:3px;cursor:pointer;font-weight:600;font-family:var(--sans)}
</style>

// ─── HELPERS ────────────────────────────────────────────────
function makeBadge(label, color, bg) {
  return `<span class="badge" style="color:${color};background:${bg}">${label}</span>`;
}
function statusBadge(s) {
  const m={Active:["var(--green)","var(--green-bg)"],Blocked:["var(--red)","var(--red-bg)"],New:["var(--accent)","var(--accent-soft)"],Dormant:["var(--dormant)","#F3F4F6"]};
  const[c,b]=m[s]||["var(--slate)","#F1F5F9"];
  return makeBadge(s,c,b);
}
function rrsBadge(r) {
  const m={Runner:["var(--runner)","#F0FDFA"],Repeater:["var(--repeater)","#EEF2FF"],Stranger:["var(--stranger)","#F8FAFC"]};
  const[c,b]=m[r]||["var(--slate)","#F1F5F9"];
  return makeBadge(r,c,b);
}
function lcBadge(l) {
  const m={Winner:["var(--winner)","var(--green-bg)"],Stable:["var(--stable)","var(--accent-soft)"],Declining:["var(--declining)","#FFF7ED"],"New Growth":["var(--new-growth)","#FAF5FF"],Dormant:["var(--dormant)","#F9FAFB"],Transitioning:["var(--amber)","var(--amber-bg)"],Growing:["var(--green)","var(--green-bg)"]};
  const[c,b]=m[l]||["var(--slate)","#F1F5F9"];
  return makeBadge(l,c,b);
}
function sparklineSVG(data, w=100, h=28, color="var(--accent)") {
  if(!data||!data.length) return "";
  const max=Math.max(...data,1);
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-(v/max)*(h-4)}`).join(" ");
  return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function trendArrow(data) {
  if(!data||data.length<2) return "";
  const first=data.slice(0,3).reduce((a,b)=>a+b,0)/3;
  const last=data.slice(-3).reduce((a,b)=>a+b,0)/3;
  const pct=((last-first)/(first||1)*100).toFixed(0);
  const up=last>first*1.05, down=last<first*0.95;
  const color=up?"var(--green)":down?"var(--red)":"var(--slate)";
  return `<span style="font-size:12px;font-weight:600;color:${color}">${up?"▲":down?"▼":"─"} ${Math.abs(pct)}%</span>`;
}
function scoreColor(s){return s>85?"var(--green)":s>70?"var(--amber)":"var(--red)"}
function sparkColor(lc){return(lc==="Declining"||lc==="Dormant")?"var(--red)":(lc==="Winner"||lc==="New Growth")?"var(--green)":"var(--accent)"}
function priorityBadge(p){const m={Critical:["var(--red)","var(--red-bg)"],High:["var(--amber)","var(--amber-bg)"],Medium:["var(--accent)","var(--accent-soft)"],Low:["var(--slate)","#F1F5F9"]};const[c,b]=m[p]||["var(--slate)","#F1F5F9"];return makeBadge(p,c,b)}
function scoreBarHTML(score,label){return`<div class="score-bar"><span class="label">${label}</span><div class="track"><div class="fill" style="width:${score}%;background:${scoreColor(score)}"></div></div><span class="val" style="color:${scoreColor(score)}">${score}%</span></div>`}

          <td><code>${b.fertA}</code></td>
          <td><code>${b.fertB}</code></td>
          <td><div style="display:flex;align-items:center;gap:6px"><div style="width:40px;height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden"><div style="width:${b.score}%;height:100%;background:${scoreColor(b.score)};border-radius:3px"></div></div><span style="font-weight:600;font-size:12px;color:${scoreColor(b.score)}">${b.score}%</span></div></td>
          <td>${b.migration?makeBadge("Yes","var(--green)","var(--green-bg)"):makeBadge("No","var(--slate)","#F1F5F9")}</td>
          <td style="font-size:12px;color:var(--navy)">${b.suggestion}</td>
          <td>${makeBadge(b.status,b.status==="confirmed"?"var(--green)":b.status==="rejected"?"var(--red)":"var(--amber)",b.status==="confirmed"?"var(--green-bg)":b.status==="rejected"?"var(--red-bg)":"var(--amber-bg)")}</td>
          <td>${b.status==="pending"?'<div style="display:flex;gap:4px"><button class="btn-confirm">Confirm</button><button class="btn-reject">Reject</button></div>':""}</td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function renderRadarTab(){
  return MIGRATIONS.map(md=>`
  <div class="radar-card">
    <div class="radar-header">
      <div>
        <div class="radar-eyebrow">DETECTED DEMAND MIGRATION</div>
        <div class="radar-segment">${md.segment}</div>
        <div class="radar-overlap">Overlap period: ${md.overlap}</div>
      </div>
      <div class="radar-conf" style="text-align:center">
        <div class="num" style="color:${md.confidence>85?"var(--green)":"var(--amber)"}">${md.confidence}%</div>
        <div class="lbl">CONFIDENCE</div>
      </div>
    </div>
    <div class="radar-grid">
      <div class="radar-side declining">
        <div class="radar-side-label" style="color:var(--red)">▼ DECLINING</div>
        <code style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy)">${md.declining.id}</code>
        <div style="font-size:11px;color:var(--slate);margin-top:2px;margin-bottom:8px">${md.declining.desc}</div>
        ${sparklineSVG(md.declining.sales,140,30,"var(--red)")}
        <div style="display:flex;gap:6px;margin-top:6px">${statusBadge(md.declining.status)} ${rrsBadge(md.declining.rrs)}</div>
      </div>
      <div class="radar-arrow">→</div>
      <div class="radar-side rising">
        <div class="radar-side-label" style="color:var(--green)">▲ RISING</div>
        <code style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy)">${md.rising.id}</code>
        <div style="font-size:11px;color:var(--slate);margin-top:2px;margin-bottom:8px">${md.rising.desc}</div>
        ${sparklineSVG(md.rising.sales,140,30,"var(--green)")}
        <div style="display:flex;gap:6px;margin-top:6px">${statusBadge(md.rising.status)} ${rrsBadge(md.rising.rrs)}</div>
      </div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-primary">Establish Lineage →</button>
      <button class="btn btn-outline">Dismiss</button>
    </div>
  </div>`).join("");
}

// ─── SCREEN 3: EXPLORER ────────────────────────────────────
function renderExplorer(){
  const v=state.explorerView;
  const sf=state.selectedFamily;
  return `
  <div class="page-header">
    <div><h1>Fert Family Explorer</h1><div class="subtitle">Visualize lineage chains, family clusters, and demand rollups across the fert universe</div></div>
    <div class="view-toggle">
      <button class="toggle-btn ${v==="clusters"?"active":""}" onclick="state.explorerView='clusters';state.selectedFamily=null;render()">Cluster Map</button>
      <button class="toggle-btn ${v==="chain"?"active":""}" onclick="state.explorerView='chain';render()">Lineage Chain</button>
    </div>
  </div>
  ${v==="clusters"?(!sf?renderClusterGrid():renderFamilyDetail()):""}
  ${v==="chain"?renderChainView():""}`;
}

function renderClusterGrid(){
  const maxVol=Math.max(...FAMILIES.map(f=>f.volume));
  return `<div class="family-grid">
    ${FAMILIES.map(fam=>{
      const ratio=fam.volume/maxVol;
      return `<div class="family-card" onclick="state.selectedFamily='${fam.id}';render()">
        <div class="family-bg" style="height:${ratio*40}%"></div>
        <div class="family-inner">
          <div class="family-header">
            <div><div class="family-name">${fam.name}</div><div class="family-meta">${fam.id} · ${fam.vertical}</div></div>
            ${lcBadge(fam.lifecycle)}
          </div>
          <div class="family-stats">
            <div class="family-stat"><div class="num" style="color:var(--navy)">${fam.count}</div><div class="lbl">Fert codes</div></div>
            <div class="family-stat"><div class="num" style="color:var(--accent)">${(fam.volume/1000).toFixed(1)}K</div><div class="lbl">12M volume</div></div>
          </div>
          <div class="family-codes">
            ${fam.members.slice(0,3).map(m=>`<code>${m}</code>`).join("")}
            ${fam.members.length>3?`<span style="font-size:10px;color:var(--slate);padding:2px 4px">+${fam.members.length-3} more</span>`:""}
          </div>
        </div>
      </div>`;
    }).join("")}
    <div class="orphan-card">
      <div class="orphan-num">3</div>
      <div style="font-size:13px;font-weight:600;color:var(--red);margin-bottom:2px">Orphan Ferts</div>
      <div style="font-size:11px;color:var(--slate)">Unmapped, no family assigned</div>
      <button class="btn-sm" style="margin-top:12px;color:var(--red);background:#fff;border:1px solid rgba(220,38,38,0.3);border-radius:4px;cursor:pointer;padding:6px 16px;font-size:11px;font-weight:600;font-family:var(--sans)">Review & Assign</button>
    </div>
  </div>`;
}

function renderFamilyDetail(){
  const fam=FAMILIES.find(f=>f.id===state.selectedFamily);
  if(!fam) return "";
  const ferts=FERTS.filter(f=>fam.members.includes(f.id)).sort((a,b)=>new Date(a.created)-new Date(b.created));
  const monthTotals=MONTHS.map((_,mi)=>ferts.reduce((s,f)=>s+(f.sales[mi]||0),0));
  const maxTotal=Math.max(...monthTotals,1);

  return `
  <button class="btn-sm btn-accent-soft" style="margin-bottom:16px" onclick="state.selectedFamily=null;render()">← Back to all families</button>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--navy)">${fam.name}</div>
        <div style="font-size:12px;color:var(--slate);margin-top:2px">${fam.id} · ${fam.count} fert codes · ${(fam.volume/1000).toFixed(1)}K units (12M)</div>
      </div>
      ${lcBadge(fam.lifecycle)}
    </div>

    <div style="font-size:12px;font-weight:600;color:var(--slate);margin-bottom:12px">Lineage Timeline</div>
    <div class="timeline">
      <div class="timeline-line"></div>
      ${ferts.map((f,i)=>{
        const dotColor=f.status==="Active"?"var(--green)":f.status==="Blocked"?"var(--red)":"var(--accent)";
        return `<div class="timeline-item">
          <div class="timeline-dot" style="background:${dotColor};box-shadow:0 0 0 2px ${dotColor}"></div>
          <div class="timeline-content">
            <div class="timeline-top">
              <code style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--navy)">${f.id}</code>
              ${statusBadge(f.status)} ${rrsBadge(f.rrs)} ${lcBadge(f.lifecycle)}
              <span style="font-size:11px;color:var(--slate);margin-left:auto">Created ${f.created}${f.blocked?" · Blocked "+f.blocked:""}</span>
            </div>
            <div class="timeline-desc">${f.desc}</div>
            <div class="timeline-metrics">
              ${sparklineSVG(f.sales,120,24,sparkColor(f.lifecycle))}
              ${trendArrow(f.sales)}
              <span style="font-size:12px;color:var(--navy);font-weight:600">${f.sales.reduce((a,b)=>a+b,0).toLocaleString()} units (12M)</span>
            </div>
            ${f.status==="Blocked"&&i<ferts.length-1?`<div class="timeline-migrate">↓ Migrated to ${ferts[i+1].id}</div>`:""}
          </div>
        </div>`;
      }).join("")}
    </div>

    <div style="font-size:12px;font-weight:600;color:var(--slate);margin-bottom:12px">Aggregate Family Demand (12 Months)</div>
    <div class="bar-chart">
      ${MONTHS.map((m,mi)=>`<div class="bar-col">
        <span class="bar-val">${monthTotals[mi]}</span>
        <div class="bar-fill" style="height:${(monthTotals[mi]/maxTotal)*70}px"></div>
        <span class="bar-label">${m}</span>
      </div>`).join("")}
    </div>
  </div>`;
}

function renderChainView(){
  const sf=state.selectedFamily;
  const fam=sf?FAMILIES.find(f=>f.id===sf):null;
  const ferts=fam?FERTS.filter(f=>fam.members.includes(f.id)).sort((a,b)=>new Date(a.created)-new Date(b.created)):[];

  return `
  <div class="chain-selector">
    <div class="lbl">Select a family to view its lineage chain:</div>
    <div class="chain-buttons">
      ${FAMILIES.map(f=>`<button class="chain-btn ${sf===f.id?"active":""}" onclick="state.selectedFamily='${f.id}';render()">${f.name} (${f.count})</button>`).join("")}
    </div>
  </div>
  ${fam?`<div class="card" style="overflow-x:auto">
    <div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:16px">${fam.name} — Lineage Chain</div>
    <div class="chain-container">
      ${ferts.map((f,i)=>{
        const nodeClass=f.status==="Active"?"active-node":f.status==="Blocked"?"blocked-node":"new-node";
        return `<div style="display:flex;align-items:center">
          <div class="chain-node ${nodeClass}">
            <div class="chain-node-header">
              <code style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--navy)">${f.id}</code>
              ${statusBadge(f.status)}
            </div>
            <div class="chain-node-desc">${f.desc}</div>
            ${sparklineSVG(f.sales,176,28,sparkColor(f.lifecycle))}
            <div class="chain-node-footer">${rrsBadge(f.rrs)} ${trendArrow(f.sales)}</div>
            <div class="chain-node-date">${f.created}</div>
          </div>
          ${i<ferts.length-1?'<div class="chain-link"><div class="chain-link-line"></div><span class="chain-link-label">NEXT</span></div>':""}
        </div>`;
      }).join("")}
    </div>
  </div>`:""}`;
}

// ─── INTERACTION HANDLERS ───────────────────────────────────
function toggleSelect(id){
  const i=state.selected.indexOf(id);
  if(i>-1) state.selected.splice(i,1); else state.selected.push(id);
  render();
}
function toggleExpand(id){
  state.expandedCard=state.expandedCard===id?null:id;
  render();
}

// ─── INIT ───────────────────────────────────────────────────
render();
</script>
</body>
</html>
